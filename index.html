<title>七日</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0c0e;
    --text: #c8c3bb;
    --text-dim: #6a6560;
    --text-faint: #3a3835;
    --border: #1e1c1a;
    --aside: #504a44;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', 'Songti SC', STSong, serif;
    font-weight: 300;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 60px 24px 100px;
  }

  #app { width: 100%; max-width: 600px; }

  #day-label {
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 1.5rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-bottom: 48px;
  }

  #story {
    font-size: 1rem;
    line-height: 2.1;
    color: var(--text);
    white-space: pre-wrap;
    margin-bottom: 48px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.55s ease, transform 0.55s ease;
  }

  #story.visible { opacity: 1; transform: translateY(0); }

  #story em {
    color: var(--aside);
    font-style: italic;
  }

  #choices {
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.45s ease 0.25s;
  }

  #choices.visible { opacity: 1; }

  .choice-btn {
    background: none;
    border: none;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    font-size: 0.92rem;
    line-height: 2;
    padding: 20px 0;
    text-align: left;
    cursor: pointer;
    transition: color 0.2s, padding-left 0.25s;
    white-space: pre-wrap;
  }

  .choice-btn:last-child { border-bottom: 1px solid var(--border); }
  .choice-btn:hover { color: var(--text); padding-left: 12px; }

  .choice-btn.opt-c {
    color: var(--text-dim);
    font-style: normal;
    font-size: 0.92rem;
  }
  .choice-btn.opt-c:hover { color: var(--text); padding-left: 12px; }

  #restart {
    display: none;
    margin-top: 60px;
    background: none;
    border: none;
    color: var(--text-faint);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    cursor: pointer;
    transition: color 0.2s;
  }
  #restart:hover { color: var(--text-dim); }

  .confrontation #story { color: var(--text-dim); font-style: italic; }
</style>
</head>
<body>
<div id="app">
  <div id="day-label"></div>
  <div id="story"></div>
  <div id="choices"></div>
  <button id="restart" onclick="startGame()">— 重新开始 —</button>
</div>

// ══════════════════════════════════════
//  游戏状态
// ══════════════════════════════════════

let scores = [0,0,0,0];  // [重量, 轻盈, 留下, 消失]
let choiceHistory = [];   // 每日选择的index

// ══════════════════════════════════════
//  结局判定
// ══════════════════════════════════════

function resolveEnding() {
  const [w, l, s, d] = scores;
  if (w===0 && l===0 && s===0 && d===0) return 'E';

  const wl = w > l ? 'w' : l > w ? 'l' : null;
  const sd = s > d ? 's' : d > s ? 'd' : null;

  if (wl && sd) {
    if (wl==='w' && sd==='s') return 'A';
    if (wl==='w' && sd==='d') return 'B';
    if (wl==='l' && sd==='d') return 'C';
    if (wl==='l' && sd==='s') return 'D';
  }
  if (!wl && sd) return sd==='s' ? (Math.random()<0.5?'A':'D') : (Math.random()<0.5?'B':'C');
  if (wl && !sd) return wl==='w' ? (Math.random()<0.5?'A':'B') : (Math.random()<0.5?'C':'D');

  // 两组都平 → 看第六日
  const d6 = choiceHistory[5];
  if (d6 === 0) return 'B';
  if (d6 === 1) return 'D';
  return null; // 第六日也选了C
}

// ══════════════════════════════════════
//  渲染工具
// ══════════════════════════════════════

function renderText(raw) {
  return raw
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/（([^）]*)）/g,'<em>（$1）</em>');
}

function fadeIn() {
  const story = document.getElementById('story');
  const choices = document.getElementById('choices');
  story.classList.remove('visible');
  choices.classList.remove('visible');
  void story.offsetWidth;
  requestAnimationFrame(()=>{
    story.classList.add('visible');
    setTimeout(()=>choices.classList.add('visible'), 220);
  });
}

// ══════════════════════════════════════
//  页面：游戏日
// ══════════════════════════════════════

function showDay(dayIndex) {
  document.getElementById('app').className = '';
  const day = DAYS[dayIndex];
  document.getElementById('day-label').textContent = day.label;
  document.getElementById('story').innerHTML = renderText(day.story);
  document.getElementById('restart').style.display = 'none';

  const el = document.getElementById('choices');
  el.innerHTML = '';
  day.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (c.isC ? ' opt-c' : '');
    btn.innerHTML = renderText(c.text);
    btn.onclick = () => onChoice(dayIndex, i);
    el.appendChild(btn);
  });
  fadeIn();
}

// ══════════════════════════════════════
//  页面：质问
// ══════════════════════════════════════

function showConfrontation() {
  document.getElementById('app').className = 'confrontation';
  document.getElementById('day-label').textContent = '第六日　·　等一下';
  document.getElementById('story').innerHTML = renderText('你确定什么都不做？\n\n这是你真实的想法吗？');
  document.getElementById('restart').style.display = 'none';

  const el = document.getElementById('choices');
  el.innerHTML = '';

  const yes = document.createElement('button');
  yes.className = 'choice-btn';
  yes.textContent = '我确定。';
  yes.onclick = () => showEnding('E');

  const no = document.createElement('button');
  no.className = 'choice-btn';
  no.innerHTML = renderText('我再想想。\n（你在暗示我什么？）');
  no.onclick = () => showDay(5);

  el.appendChild(yes);
  el.appendChild(no);
  fadeIn();
}

// ══════════════════════════════════════
//  页面：结局
// ══════════════════════════════════════

function showEnding(key) {
  document.getElementById('app').className = '';
  const ending = ENDINGS[key];
  document.getElementById('day-label').textContent = ending.label;
  document.getElementById('story').innerHTML = renderText(ending.story);
  document.getElementById('choices').innerHTML = '';
  document.getElementById('restart').style.display = 'block';
  fadeIn();
}

// ══════════════════════════════════════
//  选择处理
// ══════════════════════════════════════

function onChoice(dayIndex, choiceIndex) {
  // 如果是重新选第六日，先回滚旧分数
  if (dayIndex === 5 && choiceHistory[5] !== undefined) {
    const old = DAYS[5].choices[choiceHistory[5]].scores;
    scores = scores.map((v,i) => v - old[i]);
  }

  // 累积新分数
  const s = DAYS[dayIndex].choices[choiceIndex].scores;
  scores = scores.map((v,i) => v + s[i]);
  choiceHistory[dayIndex] = choiceIndex;

  if (dayIndex < 5) {
    showDay(dayIndex + 1);
  } else {
    // 第六日结束，判定
    const ending = resolveEnding();
    if (ending) showEnding(ending);
    else showConfrontation();
  }
}

// ══════════════════════════════════════
//  启动
// ══════════════════════════════════════

function startGame() {
  scores = [0,0,0,0];
  choiceHistory = [];
  showDay(0);
}

startGame();
</script>
